services:
  # SQS-API-compatible queue. Code uses the AWS SQS SDK against this endpoint;
  # swapping SQS_ENDPOINT for a real AWS URL is the only change needed to run on AWS.
  elasticmq:
    image: softwaremill/elasticmq-native:1.5.7
    ports:
      - "9324:9324"   # SQS API
      - "9325:9325"   # web UI

  # MQTT broker is AWS IoT Core (mTLS) — no local broker. Database is MongoDB Atlas (cloud) —
  # no local mongo. Services connect with their X.509 certs from infra/iot/certs (mounted at
  # /certs) and MONGO_URL/IOT_ENDPOINT from .env.
  node-red:
    build: ./node-red
    ports:
      - "1880:1880"
    environment:
      IOT_ENDPOINT: ${IOT_ENDPOINT}
      MONGO_URL: ${MONGO_URL}
    volumes:
      - nodered-data:/data
      - ./infra/iot/certs:/certs:ro

  ingest:
    build: ./services/ingest
    environment:
      IOT_ENDPOINT: ${IOT_ENDPOINT}
      IOT_CERT_DIR: /certs
      MONGO_URL: ${MONGO_URL}
      INGEST_PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - ./infra/iot/certs:/certs:ro

  dispatch:
    build: ./services/dispatch
    environment:
      IOT_ENDPOINT: ${IOT_ENDPOINT}
      IOT_CERT_DIR: /certs
      MONGO_URL: ${MONGO_URL}
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_QUEUE_NAME: rider-requests
      AWS_REGION: elasticmq
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      DISPATCH_PORT: "3002"
      DISPATCH_WORKERS: ${DISPATCH_WORKERS:-4}
    ports:
      - "3002:3002"
    volumes:
      - ./infra/iot/certs:/certs:ro
    depends_on:
      - elasticmq

  dashboard:
    build: ./dashboard
    environment:
      MONGO_URL: ${MONGO_URL}
      DASHBOARD_PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  nodered-data:
